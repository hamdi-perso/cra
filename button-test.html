<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Contrast Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            background: #ffffff;
        }
        
        .dark {
            background: #141923;
            color: #FAFBFC;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            margin: 0.5rem;
            border: none;
            transition: all 0.15s;
        }
        
        .btn-primary {
            background-color: #FF6A3D;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #F04E1F;
        }
        
        .btn-secondary {
            background-color: #F4F6F8;
            color: #141923;
            border: 1px solid #D1D8E0;
        }
        
        .dark .btn-secondary {
            background-color: #252D3A;
            color: #FAFBFC;
            border-color: #5A6675;
        }
        
        .btn-secondary:hover {
            background-color: #E8ECF0;
        }
        
        .dark .btn-secondary:hover {
            background-color: #3D4857;
        }
        
        .toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Button Contrast Test</h1>
    
    <button class="toggle" onclick="toggleDark()">Toggle Dark Mode</button>
    
    <div>
        <h2>Primary Buttons</h2>
        <button class="btn btn-primary">Open Modal Example</button>
        <button class="btn btn-primary">Confirm</button>
    </div>
    
    <div>
        <h2>Secondary Buttons</h2>
        <button class="btn btn-secondary">Secondary Button</button>
        <button class="btn btn-secondary">Cancel</button>
    </div>
    
    <script>
        function toggleDark() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
